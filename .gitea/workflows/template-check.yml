name: verify-baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/api/go.sum
            apps/worker/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run safe repo baseline
        run: make verify
