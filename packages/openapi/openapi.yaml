      "ReportRequest": {"type": "object", "required": ["reporter_id", "target_type", "target_id", "reason"], "properties": {"reporter_id": {"type": "string"}, "target_type": {"type": "string", "enum": ["echo", "reply", "user"]}, "target_id": {"type": "string"}, "reason": {"type": "string", "minLength": 1, "maxLength": 500}}},
      "Report": {"type": "object", "required": ["id", "reporter_id", "target_type", "target_id", "reason", "status", "created_at"], "properties": {"id": {"type": "string"}, "reporter_id": {"type": "string"}, "target_type": {"type": "string"}, "target_id": {"type": "string"}, "reason": {"type": "string"}, "status": {"type": "string", "enum": ["pending_review"]}, "created_at": {"type": "string", "format": "date-time"}}},
