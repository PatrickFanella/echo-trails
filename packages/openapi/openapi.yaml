{
  "openapi": "3.1.0",
  "info": {
    "title": "EchoTrails API",
    "version": "0.1.0",
    "description": "Baseline contract for EchoTrails public API surfaces. Some Phase 4/5 paths are forward contract fixtures and are not wired in the runnable API until their implementation pass. Product detail remains in docs/PRD.md and docs/technical-plan.md."
  },
  "x-echotrails-runtime-status": {
    "wiredInApiBinary": ["health", "auth", "places", "media"],
    "contractOnlyUntilLaterPass": ["social", "safety", "notifications", "privacy", "analytics", "beta"]
  },
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "servers": [
    {
      "url": "https://api.echotrails.example",
      "description": "Placeholder production API origin"
    }
  ],
  "tags": [
    {"name": "health"},
    {"name": "auth"},
    {"name": "places"},
    {"name": "echoes"},
    {"name": "media"},
    {"name": "social"},
    {"name": "safety"},
    {"name": "notifications"},
    {"name": "privacy"},
    {"name": "analytics"},
    {"name": "beta"}
  ],
  "paths": {
    "/health": {
      "get": {
        "tags": ["health"],
        "operationId": "getHealth",
        "summary": "Health check",
        "responses": {
          "200": {
            "description": "Service is healthy",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/HealthResponse"}
              }
            }
          }
        }
      }
    },
    "/ready": {
      "get": {
        "tags": ["health"],
        "operationId": "getReadiness",
        "summary": "Readiness check",
        "responses": {
          "200": {
            "description": "Service is ready",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HealthResponse"}}}
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "tags": ["health"],
        "operationId": "getMetrics",
        "summary": "Prometheus metrics",
        "responses": {"200": {"description": "Prometheus text metrics"}}
      }
    },
    "/auth/apple": {
      "post": {
        "tags": ["auth"],
        "operationId": "signInWithApple",
        "summary": "Exchange a Sign in with Apple identity token for an EchoTrails session",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/AppleAuthRequest"}
            }
          }
        },
        "responses": {
          "200": {"$ref": "#/components/responses/AuthTokenResponse"},
          "401": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/consent/current": {
      "get": {"tags": ["privacy"], "operationId": "getCurrentConsent", "summary": "Get current beta terms/privacy/disclosure versions", "responses": {"200": {"description": "Current consent versions", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ConsentVersion"}}}}}}
    },
    "/consent/acceptances": {
      "post": {"tags": ["privacy"], "operationId": "acceptConsent", "summary": "Record a user's accepted consent versions", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ConsentAcceptanceRequest"}}}}, "responses": {"202": {"description": "Consent accepted"}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/privacy/exports": {
      "post": {"tags": ["privacy"], "operationId": "requestPrivacyExport", "summary": "Queue async privacy export", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrivacyExportRequest"}}}}, "responses": {"202": {"description": "Export queued", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrivacyJobStatus"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/privacy/exports/{jobId}": {
      "get": {"tags": ["privacy"], "operationId": "getPrivacyExport", "summary": "Get privacy export job status", "parameters": [{"$ref": "#/components/parameters/JobId"}], "responses": {"200": {"description": "Export status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrivacyJobStatus"}}}}, "404": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/privacy/deletions": {
      "post": {"tags": ["privacy"], "operationId": "requestAccountDeletion", "summary": "Queue async account deletion", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountDeletionRequest"}}}}, "responses": {"202": {"description": "Deletion queued", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrivacyJobStatus"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/analytics/opt-out": {
      "post": {"tags": ["analytics"], "operationId": "setAnalyticsOptOut", "summary": "Set first-party analytics opt-out", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AnalyticsOptOutRequest"}}}}, "responses": {"202": {"description": "Opt-out state accepted"}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/analytics/events": {
      "post": {"tags": ["analytics"], "operationId": "recordAnalyticsEvent", "summary": "Record privacy-safe first-party analytics event", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AnalyticsEventEnvelope"}}}}, "responses": {"202": {"description": "Event accepted"}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/beta/access": {
      "post": {"tags": ["beta"], "operationId": "evaluateBetaAccess", "summary": "Evaluate invite code and city beta gate", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InviteCodeRequest"}}}}, "responses": {"200": {"description": "Beta access state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BetaAccessResponse"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/auth/email/start": {
      "post": {
        "tags": ["auth"],
        "operationId": "startEmailAuth",
        "summary": "Start passwordless email authentication",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/EmailAuthStartRequest"}
            }
          }
        },
        "responses": {
          "202": {
            "description": "Email code queued",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/EmailAuthStartResponse"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/auth/email/verify": {
      "post": {
        "tags": ["auth"],
        "operationId": "verifyEmailAuth",
        "summary": "Verify a passwordless email code",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/EmailAuthVerifyRequest"}
            }
          }
        },
        "responses": {
          "200": {"$ref": "#/components/responses/AuthTokenResponse"},
          "401": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/sessions/refresh": {
      "post": {
        "tags": ["auth"],
        "operationId": "refreshSession",
        "summary": "Rotate a refresh token and return a new access token",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/RefreshSessionRequest"}
            }
          }
        },
        "responses": {
          "200": {"$ref": "#/components/responses/AuthTokenResponse"},
          "401": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/sessions/logout": {
      "post": {
        "tags": ["auth"],
        "operationId": "logoutSession",
        "summary": "Revoke the active refresh token",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/RefreshSessionRequest"}
            }
          }
        },
        "responses": {
          "204": {"description": "Session revoked"},
          "401": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/places/search": {
      "get": {
        "tags": ["places"],
        "operationId": "searchPlaces",
        "summary": "Search active Places by name, alias, or provider mapping",
        "parameters": [
          {"$ref": "#/components/parameters/SearchQuery"},
          {"$ref": "#/components/parameters/IncludeRestricted"}
        ],
        "responses": {
          "200": {
            "description": "Place search results",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/PlaceSearchResponse"}
              }
            }
          }
        }
      }
    },
    "/places/{placeId}": {
      "get": {
        "tags": ["places"],
        "operationId": "getPlace",
        "summary": "Get a Place by ID",
        "parameters": [{"$ref": "#/components/parameters/PlaceId"}],
        "responses": {
          "200": {
            "description": "Place detail",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Place"}
              }
            }
          },
          "301": {"description": "Merged Place redirect"},
          "404": {"$ref": "#/components/responses/ErrorResponse"},
          "410": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/places/{placeId}/echoes": {
      "get": {
        "tags": ["places", "echoes"],
        "operationId": "listPlaceEchoes",
        "summary": "List published Echoes for an active Place",
        "parameters": [
          {"$ref": "#/components/parameters/PlaceId"},
          {"$ref": "#/components/parameters/Limit"}
        ],
        "responses": {
          "200": {
            "description": "Published Echoes for the Place",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PlaceEchoesResponse"}}}
          },
          "404": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/discovery/nearby": {
      "get": {
        "tags": ["places"],
        "operationId": "nearbyPlaces",
        "summary": "Find nearby active Places",
        "parameters": [
          {"$ref": "#/components/parameters/Latitude"},
          {"$ref": "#/components/parameters/Longitude"},
          {"$ref": "#/components/parameters/RadiusMeters"},
          {"$ref": "#/components/parameters/IncludeRestricted"}
        ],
        "responses": {
          "200": {
            "description": "Nearby Places",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PlaceSearchResponse"}}}
          },
          "400": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/places/requests": {
      "post": {
        "tags": ["places"],
        "operationId": "requestPlace",
        "summary": "Request a new Place for review",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/PlaceRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Place request created",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Place"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/echoes": {
      "post": {
        "tags": ["echoes"],
        "operationId": "createTextEchoDraft",
        "summary": "Create a text Echo draft",
        "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/CreateTextEchoRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Echo draft created",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Echo"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/ErrorResponse"},
          "409": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/echoes/{echoId}": {
      "get": {
        "tags": ["echoes"],
        "operationId": "getEcho",
        "summary": "Read a published Echo or an author-owned draft",
        "parameters": [{"$ref": "#/components/parameters/EchoId"}],
        "responses": {
          "200": {
            "description": "Echo detail",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Echo"}
              }
            }
          },
          "403": {"$ref": "#/components/responses/ErrorResponse"},
          "404": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/echoes/{echoId}/publish": {
      "post": {
        "tags": ["echoes"],
        "operationId": "publishEcho",
        "summary": "Publish an author-owned text Echo draft",
        "parameters": [{"$ref": "#/components/parameters/EchoId"}],
        "responses": {
          "200": {
            "description": "Echo published",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Echo"}
              }
            }
          },
          "403": {"$ref": "#/components/responses/ErrorResponse"},
          "404": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/echoes/{echoId}/reactions": {
      "put": {"tags": ["social"], "operationId": "putEchoReaction", "summary": "Set one reaction per user for an Echo", "parameters": [{"$ref": "#/components/parameters/EchoId"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReactionRequest"}}}}, "responses": {"200": {"description": "Reaction totals", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReactionSummary"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}, "403": {"$ref": "#/components/responses/ErrorResponse"}, "404": {"$ref": "#/components/responses/ErrorResponse"}}},
      "get": {"tags": ["social"], "operationId": "getEchoReactions", "summary": "Get Echo reaction totals", "parameters": [{"$ref": "#/components/parameters/EchoId"}], "responses": {"200": {"description": "Reaction totals", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReactionSummary"}}}}, "404": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/echoes/{echoId}/replies": {
      "post": {"tags": ["social"], "operationId": "createEchoReply", "summary": "Create a text reply with one-level nesting", "parameters": [{"$ref": "#/components/parameters/EchoId"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReplyRequest"}}}}, "responses": {"201": {"description": "Reply created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Reply"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}, "403": {"$ref": "#/components/responses/ErrorResponse"}, "404": {"$ref": "#/components/responses/ErrorResponse"}}},
      "get": {"tags": ["social"], "operationId": "listEchoReplies", "summary": "List oldest-first visible replies", "parameters": [{"$ref": "#/components/parameters/EchoId"}, {"name": "viewer_id", "in": "query", "required": false, "schema": {"type": "string"}}], "responses": {"200": {"description": "Visible replies", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RepliesResponse"}}}}, "404": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/echoes/{echoId}/stitches": {
      "post": {"tags": ["social"], "operationId": "createEchoStitch", "summary": "Create an Echo linked to a source Echo", "parameters": [{"$ref": "#/components/parameters/EchoId"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StitchRequest"}}}}, "responses": {"201": {"description": "Stitch created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Stitch"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}, "403": {"$ref": "#/components/responses/ErrorResponse"}, "404": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/reports": {
      "post": {"tags": ["safety"], "operationId": "createReport", "summary": "Create moderation intake report", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReportRequest"}}}}, "responses": {"201": {"description": "Report created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Report"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/hides": {
      "post": {"tags": ["safety"], "operationId": "hideTarget", "summary": "Hide a target for a viewer", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VisibilityRequest"}}}}, "responses": {"204": {"description": "Target hidden"}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/blocks": {
      "post": {"tags": ["safety"], "operationId": "blockUser", "summary": "Block a user and suppress their notifications", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VisibilityRequest"}}}}, "responses": {"204": {"description": "User blocked"}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/notifications": {
      "get": {"tags": ["notifications"], "operationId": "listNotifications", "summary": "List stored activity-safe notification records", "parameters": [{"name": "user_id", "in": "query", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Notification records", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NotificationsResponse"}}}}, "400": {"$ref": "#/components/responses/ErrorResponse"}}}
    },
    "/media/uploads": {
      "post": {
        "tags": ["media"],
        "operationId": "createMediaUpload",
        "summary": "Create a presigned direct media upload",
        "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {
          "required": true,
          "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateMediaUploadRequest"}}}
        },
        "responses": {
          "201": {"description": "Upload target created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MediaUploadResponse"}}}},
          "400": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/media/uploads/{uploadId}": {
      "get": {
        "tags": ["media"],
        "operationId": "getMediaUpload",
        "summary": "Get activity-safe media upload lifecycle status",
        "parameters": [{"$ref": "#/components/parameters/UploadId"}],
        "responses": {
          "200": {"description": "Upload and processing lifecycle status without private upload URLs after completion or expiry", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MediaUploadResponse"}}}},
          "404": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    },
    "/media/uploads/{uploadId}/complete": {
      "post": {
        "tags": ["media"],
        "operationId": "completeMediaUpload",
        "summary": "Complete a presigned direct media upload",
        "parameters": [{"$ref": "#/components/parameters/UploadId"}],
        "responses": {
          "200": {"description": "Upload completed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MediaUploadResponse"}}}},
          "400": {"$ref": "#/components/responses/ErrorResponse"},
          "404": {"$ref": "#/components/responses/ErrorResponse"}
        }
      }
    }
  },
  "components": {
    "parameters": {
      "EchoId": {"name": "echoId", "in": "path", "required": true, "schema": {"type": "string"}},
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "minLength": 1, "maxLength": 255}},
      "IncludeRestricted": {"name": "include_restricted", "in": "query", "required": false, "schema": {"type": "boolean", "default": false}},
      "JobId": {"name": "jobId", "in": "path", "required": true, "schema": {"type": "string"}},
      "Latitude": {"name": "lat", "in": "query", "required": true, "schema": {"type": "number", "minimum": -90, "maximum": 90}},
      "Limit": {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}},
      "Longitude": {"name": "lon", "in": "query", "required": true, "schema": {"type": "number", "minimum": -180, "maximum": 180}},
      "PlaceId": {"name": "placeId", "in": "path", "required": true, "schema": {"type": "string"}},
      "RadiusMeters": {"name": "radius_meters", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 10, "maximum": 10000, "default": 1000}},
      "SearchQuery": {"name": "q", "in": "query", "required": false, "schema": {"type": "string"}},
      "UploadId": {"name": "uploadId", "in": "path", "required": true, "schema": {"type": "string"}}
    },
    "responses": {
      "AuthTokenResponse": {
        "description": "Authenticated session tokens",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokenResponse"}}}
      },
      "ErrorResponse": {
        "description": "Structured error response",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
      }
    },
    "schemas": {
      "AppleAuthRequest": {
        "type": "object",
        "required": ["identity_token"],
        "properties": {"identity_token": {"type": "string", "minLength": 1}}
      },
      "AuthTokenResponse": {
        "type": "object",
        "required": ["user_id", "session_id", "access_token", "refresh_token", "access_token_expires_at", "refresh_token_expires_at"],
        "properties": {
          "user_id": {"type": "string"},
          "session_id": {"type": "string"},
          "access_token": {"type": "string"},
          "refresh_token": {"type": "string"},
          "access_token_expires_at": {"type": "string", "format": "date-time"},
          "refresh_token_expires_at": {"type": "string", "format": "date-time"}
        }
      },
      "Coordinate": {
        "type": "object",
        "required": ["lat", "lon"],
        "properties": {
          "lat": {"type": "number", "minimum": -90, "maximum": 90},
          "lon": {"type": "number", "minimum": -180, "maximum": 180}
        }
      },
      "CreateTextEchoRequest": {
        "type": "object",
        "required": ["place_id", "title", "body", "creation_token"],
        "properties": {
          "place_id": {"type": "string"},
          "title": {"type": "string", "minLength": 1, "maxLength": 80},
          "body": {"type": "string", "minLength": 1, "maxLength": 500},
          "creation_token": {"type": "string"}
        }
      },
      "CreateMediaUploadRequest": {
        "type": "object",
        "required": ["echo_id", "media_type", "content_type", "byte_size"],
        "properties": {
          "echo_id": {"type": "string"},
          "media_type": {"type": "string", "enum": ["image", "audio", "video"]},
          "content_type": {"type": "string", "enum": ["image/jpeg", "image/png", "image/heic", "audio/mpeg", "audio/mp4", "audio/wav", "video/mp4", "video/quicktime"]},
          "byte_size": {"type": "integer", "minimum": 1, "maximum": 104857600}
        }
      },
      "Echo": {
        "type": "object",
        "required": ["id", "author_handle", "place_id", "title", "body", "status", "public_location", "created_at", "updated_at"],
        "properties": {
          "id": {"type": "string"},
          "author_handle": {"type": "string"},
          "place_id": {"type": "string"},
          "title": {"type": "string"},
          "body": {"type": "string"},
          "status": {"type": "string", "enum": ["draft", "published", "limited", "removed", "deleted", "failed"]},
          "public_location": {"$ref": "#/components/schemas/Coordinate"},
          "created_at": {"type": "string", "format": "date-time"},
          "updated_at": {"type": "string", "format": "date-time"}
        }
      },
      "EchoSummary": {
        "type": "object",
        "required": ["id", "place_id", "author_id", "title", "body", "status", "published_at"],
        "properties": {
          "id": {"type": "string"},
          "place_id": {"type": "string"},
          "author_id": {"type": "string"},
          "title": {"type": "string"},
          "body": {"type": "string"},
          "status": {"type": "string", "enum": ["published"]},
          "published_at": {"type": "string", "format": "date-time"}
        }
      },
      "ConsentVersion": {"type": "object", "required": ["terms_version", "privacy_version", "disclosure", "effective_at"], "properties": {"terms_version": {"type": "string"}, "privacy_version": {"type": "string"}, "disclosure": {"type": "string"}, "effective_at": {"type": "string", "format": "date-time"}}},
      "ConsentAcceptanceRequest": {"type": "object", "required": ["terms_version", "privacy_version"], "properties": {"terms_version": {"type": "string"}, "privacy_version": {"type": "string"}}, "description": "Authenticated user is derived from session, not request body."},
      "PrivacyExportRequest": {"type": "object", "properties": {}, "description": "Authenticated user is derived from session, not request body."},
